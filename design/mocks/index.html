<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valet Mocks</title>
<!--
  Milestone 0 mocks: the command palette, the Valet menu, and the notch panel, in light and dark.
  Data is Tommy's real menu bar (valet list / valet menu, Oct 21 2026), minus anything personal.
  App icons load from design/mocks/icons/ (git-ignored; run `swift design/mocks/extract-icons.swift`).
  Serve with `make viewer`, then open http://localhost:8765/design/mocks/.
-->
<style>
  /* ─── Tokens: macOS system colors, light and dark ─── */
  :root {
    color-scheme: light;
    --accent: #0a6cff;
    --accent-text: #ffffff;
    --destructive: #e5352b;
    --label: rgba(0, 0, 0, 0.88);
    --label-2: rgba(0, 0, 0, 0.55);
    --label-3: rgba(0, 0, 0, 0.36);
    --label-4: rgba(0, 0, 0, 0.24);
    --separator: rgba(0, 0, 0, 0.1);
    --fill: rgba(0, 0, 0, 0.05);
    --fill-2: rgba(0, 0, 0, 0.08);
    --glass: rgba(248, 248, 250, 0.74);
    --glass-edge: rgba(0, 0, 0, 0.12);
    --glass-shine: rgba(255, 255, 255, 0.7);
    --menu: rgba(244, 244, 246, 0.82);
    --menubar: rgba(255, 255, 255, 0.38);
    --menubar-text: rgba(0, 0, 0, 0.86);
    --shadow: 0 24px 64px rgba(15, 20, 40, 0.28), 0 4px 14px rgba(15, 20, 40, 0.12);
    --wallpaper: radial-gradient(120% 90% at 15% 0%, #b9d4f5 0%, transparent 60%),
      radial-gradient(90% 80% at 100% 30%, #e7c9e8 0%, transparent 60%),
      linear-gradient(170deg, #cfdcf2 0%, #e9dcef 55%, #f5ddd3 100%);
    --page: #f4f4f6;
    --page-card: #ffffff;
    --page-text: #1d1d1f;
    --page-muted: #6e6e73;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #2f7bff;
    --label: rgba(255, 255, 255, 0.92);
    --label-2: rgba(255, 255, 255, 0.58);
    --label-3: rgba(255, 255, 255, 0.38);
    --label-4: rgba(255, 255, 255, 0.24);
    --separator: rgba(255, 255, 255, 0.11);
    --fill: rgba(255, 255, 255, 0.06);
    --fill-2: rgba(255, 255, 255, 0.1);
    --glass: rgba(34, 34, 38, 0.72);
    --glass-edge: rgba(255, 255, 255, 0.14);
    --glass-shine: rgba(255, 255, 255, 0.08);
    --menu: rgba(40, 40, 44, 0.8);
    --menubar: rgba(10, 10, 14, 0.32);
    --menubar-text: rgba(255, 255, 255, 0.92);
    --shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);
    --wallpaper: radial-gradient(120% 90% at 15% 0%, #1d3557 0%, transparent 60%),
      radial-gradient(90% 80% at 100% 30%, #3b2556 0%, transparent 60%),
      linear-gradient(170deg, #111a2c 0%, #22192f 55%, #2b1a22 100%);
    --page: #161618;
    --page-card: #1f1f22;
    --page-text: #f5f5f7;
    --page-muted: #98989d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--page-text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 56px; }

  /* ─── Page chrome ─── */
  header.page { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 14px; }
  header.page h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
  header.page p { margin: 0; color: var(--page-muted); }
  .seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    color: var(--page-muted); font-weight: 500;
  }
  .seg button[aria-pressed="true"] { background: var(--page-card); color: var(--page-text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .notes { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .note { background: var(--page-card); border: 0.5px solid var(--separator); border-radius: 10px; padding: 10px 12px; }
  .note b { display: block; font-weight: 600; margin-bottom: 2px; }
  .note span { color: var(--page-muted); }

  /* ─── Desktop scene ─── */
  .scene {
    position: relative; height: 640px; border-radius: 14px; overflow: hidden;
    background: var(--wallpaper); box-shadow: 0 0 0 0.5px var(--separator), 0 8px 30px rgba(0,0,0,.08);
    user-select: none;
  }
  .menubar {
    position: absolute; inset: 0 0 auto 0; height: 33px; display: flex; align-items: center;
    background: var(--menubar); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    color: var(--menubar-text); font-size: 13px; z-index: 5;
  }
  .menubar .left { width: calc(50% - 100px); display: flex; gap: 18px; padding-left: 18px; overflow: hidden; white-space: nowrap; }
  .menubar .left b { font-weight: 700; }
  .menubar .right {
    position: absolute; left: calc(50% + 100px); right: 10px; top: 0; height: 33px;
    display: flex; align-items: center; justify-content: flex-end; overflow: hidden;
  }
  .menubar .right .glyphs { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; justify-content: flex-end; min-width: 0; overflow: hidden; }
  .mbi { height: 24px; min-width: 26px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; flex: none; }
  .mbi svg { width: 16px; height: 16px; }
  .mbi.text { font-size: 13px; font-variant-numeric: tabular-nums; }
  .mbi.active { background: var(--fill-2); }
  .mbi.clickable { cursor: pointer; }
  .overflow-arrow { flex: none; margin-right: 4px; opacity: 0.85; }
  .mbi.divider { min-width: 16px; padding: 0 6px; cursor: ew-resize; touch-action: none; }
  .mbi.divider i { display: block; width: 1.5px; height: 15px; border-radius: 1px; background: currentColor; opacity: 0.5; }
  .mbi.divider:hover i, .mbi.divider.dragging i { background: var(--accent); opacity: 1; width: 2px; }
  .notch {
    position: absolute; top: 0; left: calc(50% - 92px); width: 185px; height: 32px;
    background: #000; border-radius: 0 0 11px 11px; z-index: 20;
  }

  /* ─── App icons ─── */
  .appicon { width: 24px; height: 24px; flex: none; border-radius: 6px; object-fit: contain; }
  .appicon.sm { width: 16px; height: 16px; border-radius: 4px; }
  .appicon.lg { width: 40px; height: 40px; border-radius: 10px; }
  .tile-glyph {
    display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(#8e8e93, #636366);
    color: #fff; font-weight: 600;
  }
  .tile-glyph svg { width: 62%; height: 62%; }

  /* ─── Palette ─── */
  .palette {
    position: absolute; top: 118px; left: 50%; width: min(680px, calc(100% - 32px)); transform: translateX(-50%);
    background: var(--glass); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 22px; box-shadow: var(--shadow), 0 0 0 0.5px var(--glass-edge), inset 0 0.5px 0 var(--glass-shine);
    color: var(--label); overflow: hidden; z-index: 10;
  }
  .palette.appearing { animation: pop 0.14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(0.975); } }
  .search { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; }
  .search > svg { width: 20px; height: 20px; color: var(--label-2); flex: none; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--label);
    font-size: 21px; letter-spacing: -0.012em; caret-color: var(--accent);
  }
  .search input::placeholder { color: var(--label-3); }
  .crumb {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 6px; border-radius: 8px;
    background: var(--fill-2); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none;
  }
  .crumb svg { width: 10px; height: 10px; color: var(--label-3); }
  .results { border-top: 0.5px solid var(--separator); max-height: 392px; overflow-y: auto; padding: 4px 8px 8px; scrollbar-width: thin; }
  .section { font-size: 11.5px; font-weight: 600; color: var(--label-3); padding: 10px 10px 4px; display: flex; justify-content: space-between; }
  .row {
    height: 40px; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 11px; align-items: center;
    padding: 0 10px; border-radius: 10px; font-size: 14px; cursor: default;
  }
  .row .text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .path { color: var(--label-2); }
  .row .path .sep { color: var(--label-3); padding: 0 1px; }
  .row b { font-weight: 650; }
  .row .trail { display: flex; align-items: center; gap: 8px; color: var(--label-3); font-size: 13px; }
  .row .kbd { letter-spacing: 0.06em; font-size: 13px; }
  .row .status { color: var(--label-2); font-variant-numeric: tabular-nums; }
  .row .chev svg { width: 9px; height: 9px; }
  .row .check { color: var(--accent); margin-right: 4px; }
  .row.disabled { color: var(--label-4); }
  .row.disabled .path { color: var(--label-4); }
  .row.sel { background: var(--accent); color: var(--accent-text); }
  .row.sel .path, .row.sel .trail, .row.sel .status, .row.sel .path .sep { color: rgba(255,255,255,0.78); }
  .row.sel .check { color: #fff; }
  .row.confirm { background: var(--destructive); color: #fff; }
  .row.confirm .path, .row.confirm .trail { color: rgba(255,255,255,0.85); }
  .row .pin { width: 11px; height: 11px; color: var(--label-3); }
  .row.sel .pin { color: rgba(255,255,255,0.8); }
  .divider { height: 0.5px; background: var(--separator); margin: 5px 10px; }
  .message { padding: 18px 12px 14px 45px; color: var(--label-2); font-size: 13px; position: relative; }
  .message b { color: var(--label); font-weight: 600; display: block; margin-bottom: 2px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fill-2); border-top-color: var(--label-2);
    animation: spin 0.7s linear infinite; position: absolute; left: 18px; top: 21px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer {
    height: 38px; border-top: 0.5px solid var(--separator); display: flex; align-items: center; gap: 14px;
    padding: 0 12px 0 16px; font-size: 12px; color: var(--label-2);
  }
  .footer .hint { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .footer .hint.warn { color: var(--destructive); font-weight: 500; }
  .footer .act { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .footer .act.primary { color: var(--label); font-weight: 500; }
  .cap {
    display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 4px;
    border-radius: 5px; background: var(--fill-2); color: var(--label-2); font-size: 11px; font-weight: 500;
  }
  .reopen {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
    align-items: center; gap: 10px; color: var(--label-2); font-size: 13px; text-align: center;
  }
  .reopen button {
    border: 0; border-radius: 999px; padding: 7px 14px; background: var(--glass); color: var(--label); cursor: pointer;
    backdrop-filter: blur(20px); box-shadow: 0 0 0 0.5px var(--glass-edge); font-weight: 500;
  }
  .toast {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 9px;
    padding: 9px 16px 9px 10px; border-radius: 999px; background: var(--glass); color: var(--label);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: var(--shadow), 0 0 0 0.5px var(--glass-edge); font-size: 13px; white-space: nowrap; z-index: 30;
    animation: toast 2.6s ease forwards;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 8%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .toast .path { color: var(--label-2); }

  /* ─── Native menu (Valet menu, notch menus) ─── */
  .menu {
    position: absolute; min-width: 240px; padding: 5px; border-radius: 12px; font-size: 13px; color: var(--label);
    background: var(--menu); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 12px 34px rgba(0,0,0,.22), 0 0 0 0.5px var(--glass-edge), inset 0 0.5px 0 var(--glass-shine);
    z-index: 15;
  }
  .menu.dark-only {
    --label: rgba(255,255,255,.92); --label-2: rgba(255,255,255,.58); --label-3: rgba(255,255,255,.4); --label-4: rgba(255,255,255,.26);
    --separator: rgba(255,255,255,.12); --menu: rgba(30,30,32,.9); --glass-edge: rgba(255,255,255,.14); --glass-shine: rgba(255,255,255,.06);
  }
  .mi {
    height: 24px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 7px; align-items: center;
    padding: 0 8px 0 9px; border-radius: 6px; white-space: nowrap; cursor: default;
  }
  .mi.noicon { grid-template-columns: 12px minmax(0, 1fr) auto; }
  .mi .t { overflow: hidden; text-overflow: ellipsis; }
  .mi .r { color: var(--label-3); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .mi .r svg { width: 9px; height: 9px; }
  .mi .ck { color: var(--label); font-size: 12px; text-align: center; }
  .mi.hl { background: var(--accent); color: #fff; }
  .mi.hl .r, .mi.hl .ck { color: rgba(255,255,255,.85); }
  .mi.dis { color: var(--label-4); }
  .mi.indent .t { padding-left: 0; }
  .mh { font-size: 11px; font-weight: 600; color: var(--label-3); padding: 6px 9px 2px; }
  .ms { height: 1px; background: var(--separator); margin: 5px 9px; }
  .mi .loading { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fill-2); border-top-color: var(--label-2); animation: spin .7s linear infinite; }

  /* ─── Notch panel ─── */
  .notch-hover { position: absolute; top: 0; left: calc(50% - 110px); width: 220px; height: 40px; z-index: 25; cursor: pointer; }
  /* The notch drops a neck through the menu bar, then widens below it, so the menu bar stays readable. */
  .np-neck { position: absolute; top: 0; left: calc(50% - 92.5px); width: 185px; height: 34px; background: #000; z-index: 19; }
  .np-neck::before, .np-neck::after {
    content: ""; position: absolute; bottom: 0; width: 12px; height: 12px;
    background: radial-gradient(circle at 0 0, transparent 11.5px, #000 12px);
  }
  .np-neck::before { left: -12px; transform: scaleX(-1); }
  .np-neck::after { right: -12px; }
  .np-neck.material::before, .np-neck.material::after { display: none; }
  .np-neck.material { height: 32px; border-radius: 0 0 11px 11px; }
  .np {
    position: absolute; top: 33px; left: 50%; width: 480px; transform: translateX(-50%); z-index: 19;
    background: #000; color: #fff; border-radius: 18px 18px 26px 26px; padding: 12px 14px 12px;
    transform-origin: 50% 0;
  }
  .np.appearing { animation: grow 0.24s cubic-bezier(.2, .9, .25, 1); }
  @keyframes grow { from { clip-path: inset(0 calc(50% - 92px) 100% calc(50% - 92px) round 0 0 18px 18px); } to { clip-path: inset(0 0 0 0 round 18px 18px 26px 26px); } }
  .np.material { top: 40px; border-radius: 18px; background: var(--glass); color: var(--label); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: var(--shadow), 0 0 0 .5px var(--glass-edge); }
  .np-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .np-tile {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px 8px; border-radius: 14px; cursor: pointer;
    text-align: center; min-width: 0;
  }
  .np-tile:hover, .np-tile.open { background: rgba(255,255,255,.12); }
  .np.material .np-tile:hover, .np.material .np-tile.open { background: var(--fill-2); }
  .np-tile .nm { font-size: 11.5px; font-weight: 500; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .np-tile .st { font-size: 11px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; min-height: 15px; }
  .np.material .np-tile .st { color: var(--label-2); }
  .np-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding: 6px 6px 0; border-top: .5px solid rgba(255,255,255,.12); font-size: 11.5px; color: rgba(255,255,255,.55); }
  .np.material .np-foot { border-color: var(--separator); color: var(--label-2); }
  .np-foot .cap { background: rgba(255,255,255,.14); color: rgba(255,255,255,.75); }
  .np.material .np-foot .cap { background: var(--fill-2); color: var(--label-2); }
  .scene-tip { position: absolute; bottom: 18px; left: 18px; font-size: 12px; color: var(--label-2); background: var(--glass); padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 0 .5px var(--glass-edge); backdrop-filter: blur(20px); }

  /* ─── Keep tab ─── */
  .mbi.keeper { padding: 0 4px; gap: 4px; cursor: pointer; }
  .mbi.keeper img, .mbi.keeper .tile-glyph { width: 16px; height: 16px; border-radius: 4px; }
  .mbi.keeper.mono img, .mbi.keeper.mono .tile-glyph { filter: grayscale(1) brightness(0); opacity: .82; }
  :root[data-theme="dark"] .mbi.keeper.mono img, :root[data-theme="dark"] .mbi.keeper.mono .tile-glyph { filter: grayscale(1) brightness(0) invert(1); }
  .mbi.keeper .kt { font-size: 13px; font-variant-numeric: tabular-nums; }
  .mbi.keeper.open, .mbi.keeper:hover { background: var(--fill-2); }
  .mbi.keeper.ghost { opacity: .35; }
  .board {
    position: absolute; top: 92px; left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 32px));
    background: var(--glass); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 18px; box-shadow: var(--shadow), 0 0 0 .5px var(--glass-edge); color: var(--label); padding: 16px 18px 14px;
  }
  .board-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .board-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
  .board-head .seg button { color: var(--label-2); padding: 3px 10px; }
  .board-head .seg button[aria-pressed="true"] { background: var(--page-card); color: var(--label); }
  .zone-label { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--label-3); margin: 0 2px 6px; }
  .zone { border-radius: 12px; padding: 8px; min-height: 62px; transition: background .15s, box-shadow .15s; }
  .zone.bar { background: var(--menubar); box-shadow: inset 0 0 0 .5px var(--glass-edge); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .zone.tray { background: var(--fill); display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; }
  .zone.over { box-shadow: inset 0 0 0 2px var(--accent); }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 10px; cursor: grab;
    min-width: 0; text-align: center; touch-action: none; user-select: none;
  }
  .tile:hover { background: var(--fill-2); }
  .tile.dragging { opacity: .3; }
  .tile .nm { font-size: 11.5px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile .st { font-size: 10.5px; color: var(--label-3); min-height: 13px; font-variant-numeric: tabular-nums; }
  .zone.bar .tile { flex-direction: row; padding: 5px 9px 5px 6px; gap: 6px; background: var(--page-card); box-shadow: 0 0 0 .5px var(--glass-edge); }
  .zone.bar .tile .st { min-height: 0; }
  .zone.bar .empty, .zone.tray .empty { color: var(--label-3); font-size: 12px; padding: 12px 8px; }
  .fixed { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--label-3); font-size: 11.5px; padding-right: 4px; }
  .drag-ghost { position: fixed; pointer-events: none; z-index: 1000; opacity: .9; transform: translate(-50%, -50%) scale(1.04); }
  .board-foot { margin-top: 10px; font-size: 12px; color: var(--label-2); display: flex; justify-content: space-between; gap: 12px; }

  /* ─── Divider tab ─── */
  .arrange { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .loupe { border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 .5px var(--glass-edge), 0 10px 30px rgba(0,0,0,.12); background: var(--wallpaper); }
  .loupe-scroll { overflow-x: auto; scrollbar-width: none; }
  .loupe-scroll::-webkit-scrollbar { display: none; }
  .loupe-bar {
    width: 817px; height: 33px; display: flex; align-items: center; position: relative; color: var(--menubar-text);
    background: var(--menubar); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  }
  .loupe-notch { flex: none; width: 46px; height: 32px; align-self: flex-start; background: #000; border-radius: 0 0 11px 0; }

  const start = bar.showing ? 0 : bar.divider + 1;

  for (let i = order.length - 1; i >= start; i--) {

    first = i;

// ─── Fuzzy match: every typed word must appear; word starts beat substrings beat scattered letters ───
function match(text, query) {
  const lower = text.toLowerCase();
  const hits = new Set();
  let score = 0;
  for (const token of query.toLowerCase().split(/\s+/).filter(Boolean)) {
    let at = -1;
    const re = new RegExp(`(^|[\\s›(·-])${token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`);
    const word = re.exec(lower);
    if (word) { at = word.index + word[1].length; score += 3 * token.length; }
    else if ((at = lower.indexOf(token)) >= 0) { score += 2 * token.length; }
    if (at >= 0) { for (let i = 0; i < token.length; i++) hits.add(at + i); continue; }
    let from = 0;
    for (const ch of token) {
      const found = lower.indexOf(ch, from);
      if (found < 0) return null;
      hits.add(found); from = found + 1;
    }
    score += token.length * 0.6;
  }
  return { score, hits };
}

function highlight(text, hits, offset) {
  let out = '';
  for (let i = 0; i < text.length; i++) {
    const ch = esc(text[i]);
    out += hits.has(offset + i) ? `<b>${ch}</b>` : ch;
  }
  return out;
}

    if (entry.sep) continue;
    if (entry.children) out.push(...leaves(icon, entry.children, [...prefix, entry.title]));
    else out.push({ type: 'item', icon, titles: [...prefix, entry.title], entry });
  }
  return out;
}

function keyOf(row) { return row.type === 'icon' ? `icon|${row.icon.id}` : `${row.icon.id}|${row.titles.join(' › ')}`; }

function rowFromKey(key) {
  const [id, path] = key.split('|');
  if (id === 'icon') return { type: 'icon', icon: byId[path] };
  const icon = byId[id];
  return leaves(icon).find((row) => row.titles.join(' › ') === path);
}

function indexed(icon) {
  // Menus read while closed are always searchable; on-demand ones once Valet has opened them.
  return icon.kind === 'menu' || (icon.kind === 'onDemand' && paletteState.loaded.has(icon.id));
}

function paletteRows() {
  const s = paletteState;
  const rows = [];
  if (s.stack.length) {
    const top = s.stack[s.stack.length - 1];
    const icon = top.icon;
    if (icon.kind === 'private' && !s.loaded.has(icon.id)) {
      rows.push({ type: 'message', title: `${icon.name} isn’t indexed`, body: 'Its menu is your clipboard history, so Valet leaves it out of search and recents.' });
      rows.push({ type: 'action', icon, title: `Show ${icon.name}’s menu once`, action: 'reveal' });
      return rows;
    }
    if (icon.kind === 'onDemand' && !s.loaded.has(icon.id)) {
      rows.push({ type: 'loading', title: `Reading ${icon.name}’s menu`, body: 'It opens for a moment, then closes.' });
      return rows;
    }
    const entries = top.entries;
    const q = s.query.trim();
    let lastWasSep = true;
    for (const entry of entries) {
      if (entry.sep) { if (!q && !lastWasSep) rows.push({ type: 'divider' }); lastWasSep = true; continue; }
      const m = q ? match(entry.title, q) : { score: 0, hits: new Set() };
      if (!m) continue;
      rows.push({ type: 'item', icon, titles: [...top.titles, entry.title], entry, hits: m.hits, local: true });
      lastWasSep = false;
    }
    if (rows.at(-1)?.type === 'divider') rows.pop();
    if (!rows.length) rows.push({ type: 'message', title: 'No matches', body: `Nothing in ${icon.name}’s menu matches “${s.query}”.` });
    return rows;
  }

  if (!s.query.trim()) {
    rows.push({ type: 'section', title: 'Pinned' }, ...s.pins.map(rowFromKey).filter(Boolean).map((r) => ({ ...r, pinned: true })));
    rows.push({ type: 'section', title: 'Recent' }, ...s.recent.map(rowFromKey).filter(Boolean));
    const away = tuckedIcons();
    rows.push({ type: 'section', title: 'Tucked away', count: away.length }, ...away.map((icon) => ({ type: 'icon', icon })));
    rows.push({ type: 'section', title: 'In the menu bar' }, ...barIcons().map((icon) => ({ type: 'icon', icon })));
    return rows;
  }

  const q = s.query.trim();
  const scored = [];
  for (const icon of searchable) {
    const m = match(icon.name, q);
    // Typing an app's name should land on the app, ahead of its pinned or recent items.
    const named = icon.name.toLowerCase().startsWith(q.toLowerCase());
    if (m) scored.push({ type: 'icon', icon, hits: m.hits, score: m.score + (named ? 20 : 2) });
    if (!indexed(icon)) continue;
    for (const leaf of leaves(icon)) {
      const text = [icon.name, ...leaf.titles].join(' › ');
      const lm = match(text, q);
      if (!lm) continue;
      const key = keyOf(leaf);
      const boost = (s.pins.includes(key) ? 6 : 0) + (s.recent.includes(key) ? 3 : 0) - (leaf.entry.disabled ? 4 : 0);
      scored.push({ ...leaf, hits: lm.hits, score: lm.score + boost });
    }
  }
  scored.sort((a, b) => b.score - a.score);
  const results = scored.slice(0, 40);
  const unread = searchable.filter((icon) => icon.kind === 'onDemand' && !s.loaded.has(icon.id) && !results.some((r) => r.type === 'icon' && r.icon === icon));
  if (!results.length) results.push({ type: 'message', title: 'No matches', body: `Nothing Valet has read matches “${q}”.` });
  // Only when no menu item matched: then the answer may be in a menu Valet hasn't read.
  if (unread.length && !results.some((r) => r.type === 'item')) {
    results.push({ type: 'section', title: 'Menus not read yet' }, ...unread.map((icon) => ({ type: 'icon', icon })));
  }
  return results;
}

function selectable(row) { return (row.type === 'item' && !row.entry.disabled) || row.type === 'icon' || row.type === 'action'; }

function rowHTML(row, index) {
  const s = paletteState;
  const sel = index === s.sel;
  if (row.type === 'section') return `<div class="section"><span>${row.title}</span>${row.count ? `<span>${row.count}</span>` : ''}</div>`;
  if (row.type === 'divider') return '<div class="divider"></div>';
  if (row.type === 'message') return `<div class="message"><b>${esc(row.title)}</b>${esc(row.body)}</div>`;
  if (row.type === 'loading') return `<div class="message"><span class="spinner"></span><b>${esc(row.title)}</b>${esc(row.body)}</div>`;
  if (row.type === 'action') {
    return `<div class="row${sel ? ' sel' : ''}" data-i="${index}">${appIcon(row.icon)}<span class="text">${esc(row.title)}</span><span class="trail"></span></div>`;
  }
  const icon = row.icon;
  const confirm = s.confirm === index;
  const classes = ['row', sel && !confirm ? 'sel' : '', confirm ? 'confirm' : '', row.type === 'item' && row.entry.disabled ? 'disabled' : ''].join(' ');
  let text;
  let trail = '';
  if (row.type === 'icon') {
    const name = row.hits ? highlight(icon.name, row.hits, 0) : esc(icon.name);
    text = name;
    if (icon.status && icon.status !== icon.name) trail += `<span class="status">${esc(icon.status)}</span>`;
    const drill = icon.kind === 'menu' || icon.kind === 'onDemand' || icon.kind === 'private';
    trail += drill ? `<span class="chev">${G.chevron}</span>` : '';
  } else {
    const entry = row.entry;
    const prefixTitles = row.local ? [] : [icon.name, ...row.titles.slice(0, -1)];
    const last = row.titles.at(-1);
    let lastHTML;
    if (row.hits && !row.local) {
      const offset = [icon.name, ...row.titles.slice(0, -1)].join(' › ').length + (row.titles.length ? 3 : 0);
      const prefixText = [icon.name, ...row.titles.slice(0, -1)];
      let cursor = 0;
      const prefix = prefixText.map((t) => { const part = highlight(t, row.hits, cursor); cursor += t.length + 3; return `${part}<span class="sep"> › </span>`; }).join('');
      lastHTML = highlight(last, row.hits, offset);
      text = `<span class="path">${prefix}</span>${entry.checked ? '<span class="check">✓</span>' : ''}${lastHTML}`;
    } else {
      lastHTML = row.hits ? highlight(last, row.hits, 0) : esc(last);
      // Inside a menu the breadcrumb names the app, so the checkmark takes the icon's column, as in a real menu.
      text = (prefixTitles.length ? pathHTML(prefixTitles, '') : '') + (entry.checked && !row.local ? '<span class="check">✓</span>' : '') + lastHTML;
    }
    if (confirm) trail = '<span>Press ↩ again</span>';
    else {
      if (row.pinned) trail += `<span class="pin">${G.pin}</span>`;
      if (entry.key) trail += `<span class="kbd">${entry.key}</span>`;
      if (entry.children) trail += `<span class="chev">${G.chevron}</span>`;
    }
  }
  const lead = row.local ? `<span class="check" style="text-align:center">${row.entry.checked ? '✓' : ''}</span>` : appIcon(icon);
  return `<div class="${classes}" data-i="${index}">${lead}<span class="text">${text}</span><span class="trail">${trail}</span></div>`;
}

function footerHTML(row) {
  const s = paletteState;
  const act = (label, keys, primary = false) => `<span class="act${primary ? ' primary' : ''}">${label} ${keys.map((k) => `<span class="cap">${k}</span>`).join('')}</span>`;
  if (!row) return `<span class="hint"></span>${act('Close', ['esc'])}`;
  if (s.confirm !== null) {
    const title = row.titles.at(-1);
    return `<span class="hint warn">${esc(title)} can’t be undone</span>${act('Cancel', ['esc'])}${act(esc(title.split(' ')[0]), ['↩'], true)}`;
  }
  if (row.type === 'action') return `<span class="hint">Shown this time only. It stays out of search.</span>${act('Show', ['↩'], true)}`;
  if (row.type === 'icon') {
    const icon = row.icon;
    const hint = tucked(icon) ? 'Tucked away' : icon.kind === 'onDemand' && !s.loaded.has(icon.id)
      ? 'Menu is read when you open it' : icon.kind === 'private' ? 'Not indexed: clipboard history' : '';
    const drill = icon.kind === 'menu' || icon.kind === 'onDemand' || icon.kind === 'private';
    return drill
      ? `<span class="hint">${hint}</span>${act('Show in Menu Bar', ['⌘', '↩'])}${act('Open Menu', ['↩'], true)}`
      : `<span class="hint">${hint || 'Opens a panel'}</span>${act('Open', ['↩'], true)}`;
  }
  const destructive = DESTRUCTIVE.test(row.titles.at(-1));
  const pinned = s.pins.includes(keyOf(row));
  const hint = destructive ? 'Asks before running' : tucked(row.icon) ? `${row.icon.name} is tucked away` : '';
  return `<span class="hint">${hint}</span>${row.entry.children ? act('Open', ['→']) : ''}${act(pinned ? 'Unpin' : 'Pin', ['⌘', 'P'])}${act('Show in Menu Bar', ['⌘', '↩'])}${act('Run', ['↩'], true)}`;
}

function renderPalette(scene) {
  const s = paletteState;
  scene.querySelector('.palette')?.remove();
  scene.querySelector('.reopen')?.remove();
  if (!s.open) {
    scene.append(h(`<div class="reopen"><button>Open Valet</button><span>or press ${HOTKEY}</span></div>`));
    scene.querySelector('.reopen button').onclick = () => { s.open = true; s.appearing = true; renderPalette(scene); };
    return;
  }
  const rows = paletteRows();
  if (!selectable(rows[s.sel] || {})) s.sel = rows.findIndex(selectable);
  const top = s.stack.at(-1);
  const crumb = top ? `<span class="crumb">${appIcon(top.icon, 'sm')}${esc(top.icon.name)}${top.titles.map((t) => ` ${G.chevron} ${esc(t)}`).join('')}</span>` : '';
  const placeholder = top ? `Filter ${top.titles.at(-1) || top.icon.name}` : 'Search the menu bar';
  const panel = h(`<div class="palette${s.appearing ? ' appearing' : ''}" role="dialog" aria-label="Valet">
    <div class="search">${G.search}${crumb}<input value="${esc(s.query)}" placeholder="${placeholder}" spellcheck="false" aria-label="Search"></div>
    <div class="results" role="listbox">${rows.map(rowHTML).join('')}</div>
    <div class="footer">${footerHTML(rows[s.sel])}</div>
  </div>`);
  scene.append(panel);
  s.appearing = false;
  const input = panel.querySelector('input');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  input.addEventListener('input', () => { s.query = input.value; s.sel = 0; s.confirm = null; renderPalette(scene); });
  input.addEventListener('keydown', (event) => paletteKey(event, scene, rows));
  panel.querySelectorAll('.row').forEach((el) => {
    el.addEventListener('mousemove', () => { const i = +el.dataset.i; if (i !== s.sel) { s.sel = i; s.confirm = null; renderPalette(scene); } });
    el.addEventListener('click', () => { s.sel = +el.dataset.i; activate(rows[s.sel], scene, false); });
  });
  panel.querySelector('.row.sel, .row.confirm')?.scrollIntoView({ block: 'nearest' });
  if (rows[0]?.type === 'loading' && s.loading !== top.icon.id) {
    s.loading = top.icon.id;
    setTimeout(() => {
      const icon = top.icon;
      s.loading = null;
      if (icon.resolvesTo === 'panel') { icon.kind = 'panel'; s.stack.pop(); toast(scene, `${appIcon(icon, 'sm')}${esc(icon.name)} opens a panel, not a menu`); }
      else { s.loaded.add(icon.id); s.query = ''; }
      renderPalette(scene);
    }, 650);
  }
}

function move(rows, delta) {
  const s = paletteState;
  let i = s.sel;
  for (let n = 0; n < rows.length; n++) {
    i = (i + delta + rows.length) % rows.length;
    if (selectable(rows[i])) { s.sel = i; return; }
  }
}

function drill(row, scene) {
  const s = paletteState;
  if (row.type === 'icon' && ['menu', 'onDemand', 'private'].includes(row.icon.kind)) {
    s.stack.push({ icon: row.icon, titles: [], entries: row.icon.menu || [] });
  } else if (row.type === 'item' && row.entry.children) {
    s.stack.push({ icon: row.icon, titles: row.titles, entries: row.entry.children });
  } else return false;
  s.query = ''; s.sel = 0; s.confirm = null;
  renderPalette(scene);
  return true;
}

function run(row, scene, viaMenuBar) {
  const s = paletteState;
  const key = keyOf(row);
  s.recent = [key, ...s.recent.filter((k) => k !== key)].slice(0, 3);
  s.open = false; s.query = ''; s.stack = []; s.sel = 0; s.confirm = null;
  renderPalette(scene);
  if (row.type === 'icon') {
    toast(scene, `${appIcon(row.icon, 'sm')}${row.icon.kind === 'panel' ? 'Opened' : 'Showed'} <span>${esc(row.icon.name)}</span>`);
  } else {
    const verb = viaMenuBar ? 'Opened menu at' : 'Ran';
    toast(scene, `${appIcon(row.icon, 'sm')}${verb} <span class="path">${esc(row.icon.name)} › ${row.titles.slice(0, -1).map((t) => `${esc(t)} › `).join('')}</span>${esc(row.titles.at(-1))}`);
  }
}

function activate(row, scene, viaMenuBar) {
  const s = paletteState;
  if (!row || !selectable(row)) return;
  if (row.type === 'action') { s.loaded.add(row.icon.id); s.sel = 0; renderPalette(scene); return; }
  if (row.type === 'icon') {
    if (row.icon.kind !== 'panel' && !viaMenuBar && drill(row, scene)) return;
    return run(row, scene, viaMenuBar);
  }
  if (row.entry.children) { drill(row, scene); return; }
  const destructive = DESTRUCTIVE.test(row.titles.at(-1));
  if (destructive && !viaMenuBar && s.confirm !== s.sel) { s.confirm = s.sel; renderPalette(scene); return; }
  run(row, scene, viaMenuBar && !destructive);
}

function paletteKey(event, scene, rows) {
  const s = paletteState;
  const row = rows[s.sel];
  const input = event.target;
  switch (event.key) {
    case 'ArrowDown': event.preventDefault(); s.confirm = null; move(rows, 1); renderPalette(scene); break;
    case 'ArrowUp': event.preventDefault(); s.confirm = null; move(rows, -1); renderPalette(scene); break;
    case 'ArrowRight':
      if (input.selectionStart === input.value.length && row && drill(row, scene)) event.preventDefault();
      break;
    case 'ArrowLeft':
    case 'Backspace':
      if (input.selectionStart === 0 && input.selectionEnd === 0 && s.stack.length) {
        event.preventDefault(); s.stack.pop(); s.query = ''; s.sel = 0; s.confirm = null; renderPalette(scene);
      }
      break;
    case 'Enter': event.preventDefault(); activate(row, scene, event.metaKey); break;
    case 'Escape':
      event.preventDefault();
      if (s.confirm !== null) s.confirm = null;
      else if (s.query) { s.query = ''; s.sel = 0; }
      else if (s.stack.length) { s.stack.pop(); s.sel = 0; }
      else s.open = false;
      renderPalette(scene);
      break;
    case 'p':
    case 'P':
      if (event.metaKey && row?.type === 'item') {
        event.preventDefault();
        const key = keyOf(row);
        s.pins = s.pins.includes(key) ? s.pins.filter((k) => k !== key) : [...s.pins, key];
        renderPalette(scene);
      }
      break;
  }
}

// ═══════════════════════════════════════════════════════════════
// Valet menu (the status item's menu)
// ═══════════════════════════════════════════════════════════════
const menuState = { open: true, hover: 'mark', loaded: new Set() };

function menuItemHTML(entry, path) {
  if (entry.sep) return '<div class="ms"></div>';
  const cls = ['mi', 'noicon', entry.disabled ? 'dis' : ''].join(' ');
  const right = entry.children ? G.chevron : entry.key ? esc(entry.key) : '';
  return `<div class="${cls}" data-path="${esc(path)}"><span class="ck">${entry.checked ? '✓' : ''}</span><span class="t">${esc(entry.title)}</span><span class="r">${right}</span></div>`;
}

function renderMenu(scene) {
  const s = menuState;
  scene.innerHTML = menubarHTML({ activeValet: s.open });
  scene.append(h(`<div class="scene-tip">Hover an icon to see its mirrored menu. ⌥-click Valet to show tucked icons in the bar.</div>`));
  const valetIcon = scene.querySelector('[data-strip="main"] [data-id="valet"]');
  if (valetIcon) {
    valetIcon.onclick = (event) => {
      if (event.altKey) { bar.showing = !bar.showing; s.open = false; } else s.open = !s.open;
      renderMenu(scene);
    };
  }
  if (!s.open) return;

  const row = (icon) => {
    const hasMenu = ['menu', 'onDemand', 'private'].includes(icon.kind);
    const right = `${icon.status && icon.status !== icon.name ? `<span>${esc(icon.status)}</span>` : ''}${hasMenu ? G.chevron : ''}`;
    return `<div class="mi${s.hover === icon.id ? ' hl' : ''}" data-icon="${icon.id}">${appIcon(icon, 'sm')}<span class="t">${esc(icon.name)}</span><span class="r">${right}</span></div>`;
  };
  const away = tuckedIcons();
  const inBar = barIcons();
  const menu = h(`<div class="menu" style="width: 272px">
    <div class="mi" data-search>${G.search.replace('viewBox', 'width="14" height="14" viewBox')}<span class="t">Search Menu Bar…</span><span class="r">${HOTKEY}</span></div>
    <div class="ms"></div>
    <div class="mh">Tucked away</div>
    ${away.length ? away.map(row).join('') : '<div class="mi noicon dis"><span></span><span class="t">Nothing tucked yet</span><span class="r"></span></div>'}
    <div class="ms"></div>
    <div class="mh">In the menu bar</div>
    ${inBar.map(row).join('')}
    <div class="ms"></div>
    <div class="mi noicon" data-showing><span class="ck">${bar.showing ? '✓' : ''}</span><span class="t">Show Tucked Icons</span><span class="r">⌥-click</span></div>
    <div class="mi noicon" data-arrange><span></span><span class="t">Arrange Menu Bar…</span><span class="r"></span></div>
    <div class="ms"></div>
    <div class="mi noicon"><span></span><span class="t">Settings…</span><span class="r">⌘,</span></div>
    <div class="mi noicon"><span></span><span class="t">Quit Valet</span><span class="r">⌘Q</span></div>
  </div>`);
  scene.append(menu);

  // Anchor under the Valet icon, like a real status item menu.
  const box = scene.getBoundingClientRect();
  const anchor = valetIcon?.getBoundingClientRect() ?? { left: box.right - 280 };
  const left = Math.max(8, Math.min(anchor.left - box.left - 6, box.width - 272 - 8));
  menu.style.left = `${left}px`;
  menu.style.top = '36px';

  menu.querySelectorAll('[data-icon]').forEach((el) => {
    el.addEventListener('mouseenter', () => { if (s.hover !== el.dataset.icon) { s.hover = el.dataset.icon; renderMenu(scene); } });
    el.addEventListener('click', () => {
      const icon = byId[el.dataset.icon];
      if (icon.kind === 'panel') { s.open = false; renderMenu(scene); toast(scene, `${appIcon(icon, 'sm')}Opened ${esc(icon.name)}`); }
    });
  });
  menu.querySelector('[data-search]').onclick = () => { switchTab('palette'); };
  menu.querySelector('[data-showing]').onclick = () => { bar.showing = !bar.showing; s.open = false; renderMenu(scene); };
  menu.querySelector('[data-arrange]').onclick = () => { bar.showing = true; switchTab('divider'); };
  menu.querySelectorAll('[data-showing], [data-arrange], [data-search]').forEach((el) => {
    el.addEventListener('mouseenter', () => { menu.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')); el.classList.add('hl'); s.hover = null; scene.querySelectorAll('.menu + .menu').forEach((x) => x.remove()); });
  });

  const icon = byId[s.hover];
  if (!icon || !['menu', 'onDemand', 'private'].includes(icon.kind)) return;
  const rowEl = menu.querySelector(`[data-icon="${icon.id}"]`);
  let items;
  if (icon.kind === 'onDemand' && !s.loaded.has(icon.id)) {
    items = `<div class="mi noicon dis"><span class="loading"></span><span class="t">Reading menu…</span><span class="r"></span></div>`;
    setTimeout(() => {
      if (icon.resolvesTo === 'panel') icon.kind = 'panel';
      else s.loaded.add(icon.id);
      if (menuState.hover === icon.id) renderMenu(scene);
    }, 600);
  } else if (icon.kind === 'private') {
    items = `<div class="mi noicon dis"><span></span><span class="t">History not indexed</span><span class="r"></span></div><div class="ms"></div>` +
      icon.menu.map((e) => menuItemHTML(e, icon.id)).join('');
  } else {
    items = icon.menu.map((e) => menuItemHTML(e, icon.id)).join('');
  }
  const sub = h(`<div class="menu">${items}</div>`);
  scene.append(sub);
  const r = rowEl.getBoundingClientRect();
  const width = sub.getBoundingClientRect().width;
  const roomRight = box.right - r.right;
  sub.style.left = roomRight > width + 8 ? `${r.right - box.left + 4}px` : `${r.left - box.left - width - 4}px`;
  sub.style.top = `${Math.min(r.top - box.top - 5, box.height - sub.getBoundingClientRect().height - 8)}px`;
  sub.querySelectorAll('.mi:not(.dis)').forEach((el) => {
    el.addEventListener('mouseenter', () => { sub.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')); el.classList.add('hl'); });
    el.addEventListener('click', () => {
      const title = el.querySelector('.t').textContent;
      s.open = false; renderMenu(scene);
      toast(scene, `${appIcon(icon, 'sm')}Ran <span class="path">${esc(icon.name)} › </span>${esc(title)}`);
    });
  });
}

// ═══════════════════════════════════════════════════════════════
// Notch panel
// ═══════════════════════════════════════════════════════════════
const notchState = { open: true, appearing: true, style: 'black', tile: null };

function renderNotch(scene) {
  const s = notchState;
  scene.innerHTML = menubarHTML();
  const hidden = tuckedIcons();
  const style = h(`<div class="scene-tip" style="display:flex;gap:8px;align-items:center">Panel <span class="seg" style="background:var(--fill)">
    <button data-style="black" aria-pressed="${s.style === 'black'}">Black</button><button data-style="material" aria-pressed="${s.style === 'material'}">Material</button></span>
    <span>· Click the notch to toggle</span></div>`);
  scene.append(style);
  style.querySelectorAll('[data-style]').forEach((b) => { b.onclick = () => { s.style = b.dataset.style; renderNotch(scene); }; });
  const hover = h('<div class="notch-hover" title="Hover or click the notch"></div>');
  scene.append(hover);
  hover.onclick = () => { s.open = !s.open; s.appearing = s.open; s.tile = null; renderNotch(scene); };
  if (!s.open) return;

  const tiles = hidden.map((icon) => {
    const status = icon.status && icon.status !== icon.name ? icon.status : '';
    return `<div class="np-tile${s.tile === icon.id ? ' open' : ''}" data-icon="${icon.id}">${appIcon(icon, 'lg')}<span class="nm">${esc(icon.name)}</span><span class="st">${esc(status)}</span></div>`;
  }).join('');
  scene.append(h(`<div class="np-neck ${s.style === 'material' ? 'material' : ''}"></div>`));
  const panel = h(`<div class="np ${s.style === 'material' ? 'material' : ''}${s.appearing ? ' appearing' : ''}">
    <div class="np-grid">${tiles}</div>
    <div class="np-foot"><span>${hidden.length} icons tucked away</span><span>Search <span class="cap">${HOTKEY}</span></span></div>
  </div>`);
  scene.append(panel);
  s.appearing = false;
  panel.querySelectorAll('[data-icon]').forEach((el) => {
    el.onclick = () => {
      const icon = byId[el.dataset.icon];
      if (icon.kind === 'panel') { s.open = false; renderNotch(scene); toast(scene, `${appIcon(icon, 'sm')}Opened ${esc(icon.name)}`); return; }
      s.tile = s.tile === icon.id ? null : icon.id;
      renderNotch(scene);
    };
  });

  const icon = byId[s.tile];
  if (!icon) return;
  const tileEl = panel.querySelector(`[data-icon="${icon.id}"]`);
  const items = icon.kind === 'onDemand'
    ? '<div class="mi noicon dis"><span class="loading"></span><span class="t">Reading menu…</span><span class="r"></span></div>'
    : icon.menu.map((e) => menuItemHTML(e, icon.id)).join('');
  // Menus float above everything, the notch panel included.
  const sub = h(`<div class="menu ${s.style === 'black' ? 'dark-only' : ''}" style="z-index: 30">${items}</div>`);
  scene.append(sub);
  const box = scene.getBoundingClientRect();
  const r = tileEl.getBoundingClientRect();
  const width = sub.getBoundingClientRect().width;
  sub.style.left = `${Math.max(8, Math.min(r.left - box.left + r.width / 2 - width / 2, box.width - width - 8))}px`;
  sub.style.top = `${r.bottom - box.top + 6}px`;
  sub.querySelectorAll('.mi:not(.dis)').forEach((el) => {
    el.addEventListener('mouseenter', () => { sub.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')); el.classList.add('hl'); });
    el.addEventListener('click', () => {
      const title = el.querySelector('.t').textContent;
      s.open = false; s.tile = null; renderNotch(scene);
      toast(scene, `${appIcon(icon, 'sm')}Ran <span class="path">${esc(icon.name)} › </span>${esc(title)}`);
    });
  });
}

// ═══════════════════════════════════════════════════════════════
// Divider
// ═══════════════════════════════════════════════════════════════
function renderDivider(scene) {
  scene.innerHTML = menubarHTML();
  const away = tuckedIcons();
  const inBar = barIcons();
  const chips = away.map((icon) => `<span class="chip">${appIcon(icon, 'sm')}${esc(icon.name)}</span>`).join('');
  const panel = h(`<div class="arrange">
    <div class="loupe">
      <div class="loupe-scroll"><div class="loupe-bar"><span class="loupe-notch"></span><div class="loupe-right">${stripHTML('loupe')}</div></div></div>
      <div class="loupe-cap"><span>Your 16-inch MacBook Pro, right of the notch, actual size</span><span>${bar.showing ? 'Drag the line' : '» is Apple’s overflow arrow'}</span></div>
    </div>
    <div class="arrange-card">
      <h2>Everything left of Valet is tucked away</h2>
      <span class="seg"><button data-mode="tucked" aria-pressed="${!bar.showing}">Tucked</button><button data-mode="showing" aria-pressed="${bar.showing}">Showing all</button></span>
      <p>${bar.showing
        ? 'Drag the line to choose what stays in the menu bar. In the app you ⌘-drag it, like any icon; Valet’s icon moves with it.'
        : 'Valet widens its divider until macOS collapses it, and every icon to its left, behind the overflow arrow. Nothing else is moved.'}</p>
      <span class="counts">${away.length} tucked · ${inBar.length} in the menu bar</span><span></span>
      <div class="chips">${chips || '<span class="counts">Nothing tucked. Drag the line left of an icon to tuck it.</span>'}</div>
    </div>
  </div>`);
  scene.append(panel);
  const scroller = panel.querySelector('.loupe-scroll');
  scroller.scrollLeft = scroller.scrollWidth;
  panel.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { bar.showing = b.dataset.mode === 'showing'; refresh(); }; });
  // On a narrow bar even Valet's icon can collapse while showing everything, so it may not be there to click.
  const valetIcon = scene.querySelector('[data-strip="main"] [data-id="valet"]');
  if (valetIcon) {
    valetIcon.onclick = (event) => {
      if (event.altKey) { bar.showing = !bar.showing; refresh(); } else { menuState.open = true; switchTab('menu'); }
    };
  }
}

// ═══════════════════════════════════════════════════════════════
// Keep: tuck everything, pick favorites back
// ═══════════════════════════════════════════════════════════════
// Valet's icon sits next to Apple's items, so every third-party icon is tucked. The ones you keep come back as
// keepers: Valet's own items, in any order, each opening the app's mirrored menu. Valet never moves the real icons.
const SYSTEM_IDS = new Set(['battery', 'wifi', 'recording', 'spotlight', 'control', 'clock']);
const thirdParty = searchable.filter((icon) => !SYSTEM_IDS.has(icon.id));
const keepState = { kept: ['burn', 'mark', 'fritter'], style: 'icon', open: null, drag: null };

function keeperHTML(icon) {
  const style = keepState.style;
  const open = keepState.open === icon.id ? ' open' : '';
  const status = icon.status && icon.status !== icon.name ? icon.status : '';
  if (style === 'status' && status) return `<span class="mbi keeper${open}" data-keeper="${icon.id}" title="${esc(icon.name)}"><span class="kt">${esc(status)}</span></span>`;
  const mono = style === 'icon' ? '' : ' mono';
  const text = style === 'status' && status ? `<span class="kt">${esc(status)}</span>` : '';
  return `<span class="mbi keeper${mono}${open}" data-keeper="${icon.id}" title="${esc(icon.name)}">${appIcon(icon, 'sm')}${text}</span>`;
}

/// The right side of the bar with keepers: », the keepers, Valet, then Apple's items.
function keepGlyphsHTML() {
  const system = searchable.filter((icon) => SYSTEM_IDS.has(icon.id));
  const glyph = (icon) => icon.text
    ? `<span class="mbi text">${esc(icon.text)}</span>`
    : `<span class="mbi" title="${esc(icon.name)}">${G[icon.system || icon.glyph]}</span>`;
  const keepers = keepState.kept.map((id) => keeperHTML(byId[id])).join('');
  return `<div class="glyphs"><span class="mbi overflow-arrow" title="Show Hidden Menu Bar Items">${G.overflow}</span>${keepers}<span class="mbi" title="Valet">${G.valet}</span>${system.map(glyph).join('')}</div>`;
}

function keepBarHTML() {
  return `<div class="menubar">
    <div class="left"><span style="font-size:15px"></span><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span></div>
    <div class="right">${keepGlyphsHTML()}</div>
  </div><div class="notch"></div>`;
}

function tileHTML(icon, inBar) {
  const status = icon.status && icon.status !== icon.name ? icon.status : '';
  return `<div class="tile" data-tile="${icon.id}" data-zone="${inBar ? 'bar' : 'tray'}" title="${inBar ? 'Drag down to tuck away' : 'Drag up to keep in the menu bar'}">
    ${appIcon(icon, inBar ? 'sm' : '')}<span class="nm">${esc(icon.name)}</span>${inBar ? '' : `<span class="st">${esc(status)}</span>`}
  </div>`;
}

function renderKeep(scene) {
  const s = keepState;
  scene.innerHTML = keepBarHTML();
  const tucked = thirdParty.filter((icon) => !s.kept.includes(icon.id));
  const board = h(`<div class="board">
    <div class="board-head">
      <h2>Choose what stays in the menu bar</h2>
      <span class="seg"><button data-style="icon" aria-pressed="${s.style === 'icon'}">App icon</button><button data-style="mono" aria-pressed="${s.style === 'mono'}">Mono</button><button data-style="status" aria-pressed="${s.style === 'status'}">Status</button></span>
    </div>
    <div class="loupe" style="margin-bottom: 14px">
      <div class="loupe-scroll"><div class="loupe-bar"><span class="loupe-notch"></span><div class="loupe-right">${keepGlyphsHTML()}</div></div></div>
      <div class="loupe-cap"><span>Your 16-inch MacBook Pro, right of the notch, actual size</span><span>Click a keeper</span></div>
    </div>
    <div class="zone-label"><span>In your menu bar</span><span>${s.kept.length} kept · drag to reorder</span></div>
    <div class="zone bar" data-drop="bar">${s.kept.map((id) => tileHTML(byId[id], true)).join('') || '<span class="empty">Drag icons here to keep them in the menu bar.</span>'}
      <span class="fixed">${G.valet.replace('viewBox', 'width="14" height="14" viewBox')} Valet, then Apple’s items</span></div>
    <div class="zone-label"><span>Tucked away</span><span>${tucked.length} · in the Valet menu</span></div>
    <div class="zone tray" data-drop="tray">${tucked.map((icon) => tileHTML(icon, false)).join('') || '<span class="empty">Everything is in the menu bar.</span>'}</div>
    <div class="board-foot"><span>Kept icons are Valet’s own items, so they can go in any order. The real icons stay tucked.</span><span>Click a tile to move it</span></div>
  </div>`);
  scene.append(board);
  const scroller = board.querySelector('.loupe-scroll');
  scroller.scrollLeft = scroller.scrollWidth;
  board.querySelectorAll('[data-style]').forEach((b) => { b.onclick = () => { s.style = b.dataset.style; renderKeep(scene); }; });

  // Clicking a keeper in the bar opens the app's mirrored menu under it, or presses it for panel apps.
  scene.querySelectorAll('[data-keeper]').forEach((el) => {
    el.onclick = () => {
      const icon = byId[el.dataset.keeper];
      if (!icon.menu || icon.kind === 'panel' || icon.kind === 'onDemand') { toast(scene, `${appIcon(icon, 'sm')}Opened ${esc(icon.name)}`); return; }
      s.open = s.open === icon.id ? null : icon.id;
      s.openIn = el.closest('.loupe') ? 'loupe' : 'bar';
      renderKeep(scene);
    };
  });
  const openEl = s.open && scene.querySelector(`${s.openIn === 'loupe' ? '.loupe ' : '.menubar '}[data-keeper="${s.open}"]`);
  if (openEl) {
    const icon = byId[s.open];
    const sub = h(`<div class="menu" style="z-index:40">${icon.menu.map((e) => menuItemHTML(e, icon.id)).join('')}</div>`);
    scene.append(sub);
    const box = scene.getBoundingClientRect();
    const r = openEl.getBoundingClientRect();
    sub.style.left = `${Math.max(8, Math.min(r.left - box.left, box.width - sub.getBoundingClientRect().width - 8))}px`;
    sub.style.top = `${r.bottom - box.top + 4}px`;
    sub.querySelectorAll('.mi:not(.dis)').forEach((el) => {
      el.addEventListener('mouseenter', () => { sub.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl')); el.classList.add('hl'); });
      el.addEventListener('click', () => { s.open = null; renderKeep(scene); toast(scene, `${appIcon(icon, 'sm')}Ran <span class="path">${esc(icon.name)} › </span>${esc(el.querySelector('.t').textContent)}`); });
    });
  }

  board.querySelectorAll('[data-tile]').forEach((tile) => {
    tile.addEventListener('pointerdown', (event) => startTileDrag(event, tile, scene));
  });
}

// Pointer-driven drag: between the two zones, and within the bar to reorder. A click without movement toggles.
function startTileDrag(event, tile, scene) {
  event.preventDefault();
  const s = keepState;
  const id = tile.dataset.tile;
  const start = { x: event.clientX, y: event.clientY };
  let ghost = null;
  const zones = () => [...document.querySelectorAll('[data-drop]')];
  const zoneAt = (x, y) => zones().find((z) => { const r = z.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
  const move = (e) => {
    if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
    if (!ghost) {
      ghost = tile.cloneNode(true);
      ghost.classList.add('drag-ghost');
      document.body.append(ghost);
      tile.classList.add('dragging');
    }
    ghost.style.left = `${e.clientX}px`;
    ghost.style.top = `${e.clientY}px`;
    zones().forEach((z) => z.classList.toggle('over', z === zoneAt(e.clientX, e.clientY)));
  };
  const up = (e) => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    const kept = s.kept.filter((k) => k !== id);
    if (!ghost) {
      // A click: move it to the other zone.
      s.kept = s.kept.includes(id) ? kept : [...kept, id];
    } else {
      ghost.remove();
      const zone = zoneAt(e.clientX, e.clientY);
      if (zone?.dataset.drop === 'bar') {
        // Insert before the first kept tile whose center is right of the drop point.
        const tiles = [...zone.querySelectorAll('[data-tile]')].filter((t) => t.dataset.tile !== id);
        const index = tiles.findIndex((t) => { const r = t.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
        kept.splice(index < 0 ? kept.length : index, 0, id);
        s.kept = kept;
      } else if (zone?.dataset.drop === 'tray') {
        s.kept = kept;
      }
    }
    if (s.open && !s.kept.includes(s.open)) s.open = null;
    renderKeep(scene);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

// ═══════════════════════════════════════════════════════════════
// Page: tabs, appearance, review notes
// ═══════════════════════════════════════════════════════════════
const NOTES = {
  keep: [
    ['Try it', 'Drag a tile up to keep it, down to tuck it, or along the bar to reorder. Click a keeper in the menu bar to open its mirrored menu.'],
    ['Why keepers', 'Valet can’t move other apps’ icons, so it tucks all of them and draws its own item for each one you keep. Those it can order freely.'],
    ['Open: keeper look', 'Valet can’t read an app’s menu bar glyph without Screen Recording. App icon is clear but colorful; Mono reads as native but blobby; Status shows live text like Burn’s 56%.'],
    ['Open: panel apps', 'Keepers for Claude, Burn or Gemini press the real (tucked) icon, so their panel opens wherever macOS puts it. That placement is still unverified.'],
  ],
  divider: [
    ['Try it', 'Switch to Showing all, then drag the line left or right. Tucked mode updates both bars and the Valet menu.'],
    ['One rule to explain', '“Everything left of Valet is tucked away.” The divider is a separate item that stays next to Valet’s icon, because a wide item collapses itself.'],
    ['Open: divider look', 'A thin line, shown only while arranging. When tucked, the divider is invisible and collapsed with the icons it tucks.'],
    ['Open: keeping them together', 'If you ⌘-drag only Valet’s icon, Valet has to move its divider after it. Placing it from code wasn’t exact in the spike; it needs a second try.'],
  ],
  palette: [
    ['Try it', 'Type “snooze hour”, “clean up” or “quit”. → opens a menu, ← goes back, ⌘P pins, ⌘↩ opens the real menu at the icon.'],
    ['Destructive items ask twice', 'Return on Quit or Delete turns the row red; Return again runs it. ⌘↩ skips the check, as in the plan.'],
    ['Menus read on open', 'Dropbox and Creative Cloud only build their menus when opened. → reads it once (a short flicker), then it’s searchable.'],
    ['Open: default hotkey', `${HOTKEY} is a placeholder. It avoids Spotlight (⌘Space) and Raycast (⌥Space).`],
  ],
  menu: [
    ['Search row first', `It teaches the palette and its hotkey to people who only use the mouse.`],
    ['The main surface', 'Tucked icons first, then what’s still in the bar. Each mirrors its real menu as a submenu; panel apps (Burn, Claude) open on click.'],
    ['Arranging lives here too', '“Show Tucked Icons” (or ⌥-click Valet) puts them back in the bar for a moment. “Arrange Menu Bar…” opens the divider view.'],
    ['Status on the right', 'Burn’s 56% and Battery’s 84% come from the icon’s own title, so you can read them without opening anything.'],
    ['Open: first run', 'New icons start on the far left, so Valet’s icon lands behind the arrow at first. Onboarding should place it, or ask you to ⌘-drag it right.'],
  ],
  notch: [
    ['Only the tucked icons', 'The same set as the Valet menu’s “Tucked away”, with status where the icon has one. Five across fits 17 icons in four rows.'],
    ['Open: black or material', 'Black reads as the notch growing and matches the hardware in both modes. Material matches system menus but looks detached from the notch.'],
    ['Opens on hover or click', 'Off by default on Macs without a notch. Hover needs a short delay so passing the cursor over the notch doesn’t trigger it.'],
  ],
};

let tab = 'menu';
const scene = document.getElementById('scene');

function switchTab(next) {
  tab = next;
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  scene.innerHTML = '';
  // The Valet menu lists all 23 icons, so its desktop needs to be taller.
  scene.style.height = tab === 'menu' ? '850px' : '';
  if (tab === 'palette') { scene.innerHTML = menubarHTML(); paletteState.open = true; paletteState.appearing = true; renderPalette(scene); }
  if (tab === 'menu') { menuState.open = true; renderMenu(scene); }
  if (tab === 'notch') { notchState.open = true; notchState.appearing = true; renderNotch(scene); }
  if (tab === 'divider') renderDivider(scene);
  if (tab === 'keep') renderKeep(scene);
  document.getElementById('notes').replaceChildren(...NOTES[tab].map(([title, body]) => h(`<div class="note"><b>${esc(title)}</b><span>${esc(body)}</span></div>`)));
}

/// Redraws the current tab without resetting it (used while dragging the divider).
function refresh() {
  if (tab === 'menu') renderMenu(scene);
  else if (tab === 'divider') renderDivider(scene);
  else if (tab === 'keep') renderKeep(scene);
  else if (tab === 'notch') renderNotch(scene);
  else { scene.querySelector('.menubar')?.remove(); scene.querySelector('.notch')?.remove(); scene.insertAdjacentHTML('afterbegin', menubarHTML()); }
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('[data-theme]').forEach((b) => b.getAttribute('data-theme') && b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
  try { localStorage.setItem('valet-mocks-theme', theme); } catch {}
  switchTab(tab);
}

document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
document.querySelectorAll('button[data-theme]').forEach((b) => { b.onclick = () => setTheme(b.dataset.theme); });
document.addEventListener('keydown', (event) => {
  // ⌃⌥Space reopens the palette, like the real hotkey.
  if (event.code === 'Space' && event.ctrlKey && event.altKey) { event.preventDefault(); switchTab('palette'); }
});

let saved = null;
try { saved = localStorage.getItem('valet-mocks-theme'); } catch {}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
