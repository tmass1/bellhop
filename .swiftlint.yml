included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
  - dist

disabled_rules:
  - trailing_comma  # Swift style: trailing commas keep diffs to one line
  - optional_data_string_conversion  # String(decoding:as:) is the intended lossy decode

line_length:
  warning: 120
  error: 160
  ignores_comments: true

type_name:
  excluded: [AX]

identifier_name:
  excluded: [x, y, w, h, id, ms, ax, el, fd]

type_body_length:
  warning: 300
file_length:
  warning: 500
function_body_length:
  warning: 60
cyclomatic_complexity:
  warning: 15
